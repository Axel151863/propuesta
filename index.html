<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi hermosa novia</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: black;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Contenedor central para las fotos y el texto */
        #content-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            z-index: 10;
            width: 90%;
            max-width: 450px;
            text-align: center;
        }

        /* Título romántico */
        h1 {
            font-size: 2.2rem;
            text-shadow: 0 0 15px rgba(255, 0, 0, 0.9), 0 0 25px rgba(255, 0, 0, 0.6);
            margin: 0;
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Contenedor para alinear las fotos horizontalmente */
        .photos-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            width: 100%;
            margin-top: 10px;
        }

        /* Estilo para los marcos de las fotos */
        .photo-wrapper {
            position: relative;
            width: 135px;
            height: 185px;
            background: #111;
            border: 4px solid white;
            border-radius: 8px;
            box-shadow: 0 8px 25px rgba(255, 0, 0, 0.5);
            transition: transform 0.3s ease;
        }

        /* Rotación sutil para dar estilo de collage/álbum */
        .photo-left {
            transform: rotate(-6deg);
        }

        .photo-right {
            transform: rotate(6deg);
        }

        .photo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 4px;
        }

        /* Corazones decorativos en las esquinas de las fotos */
        .corner-heart {
            position: absolute;
            font-size: 20px;
            color: red;
            text-shadow: 0 0 8px rgba(255, 0, 0, 1);
            z-index: 15;
            animation: pulse 1.5s infinite ease-in-out;
        }

        .top-left { top: -14px; left: -14px; }
        .top-right { top: -14px; right: -14px; }
        .bottom-left { bottom: -14px; left: -14px; }
        .bottom-right { bottom: -14px; right: -14px; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <canvas id="stage"></canvas>

    <div id="content-container">
        <h1>Para mi niña hermosa ❤️</h1>

        <div class="photos-row">
            <div class="photo-wrapper photo-left">
                <img src="" alt="Amor Foto 1">
                <span class="corner-heart top-left">❤️</span>
                <span class="corner-heart top-right">❤️</span>
                <span class="corner-heart bottom-left">❤️</span>
                <span class="corner-heart bottom-right">❤️</span>
            </div>

            <div class="photo-wrapper photo-right">
                <img src="" alt="Amor Foto 2">
                <span class="corner-heart top-left">❤️</span>
                <span class="corner-heart top-right">❤️</span>
                <span class="corner-heart bottom-left">❤️</span>
                <span class="corner-heart bottom-right">❤️</span>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('stage');
        const ctx = canvas.getContext('2d');
        
        let fase = 'texto';
        let stars = [];
        let startTime = Date.now();

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initStars();
        }
        window.addEventListener('resize', resize);

        function initStars() {
            stars = [];
            for (let i = 0; i < 120; i++) {
                stars.push({ 
                    x: Math.random() * canvas.width, 
                    y: Math.random() * canvas.height, 
                    size: Math.random() * 1.5, 
                    speed: Math.random() * 0.04 + 0.01 
                });
            }
        }

        let bSi;
        function drawButtons() {
            // El corazón flotante principal centrado en la parte inferior
            const yBtn = canvas.height * 0.78; 
            const xBtn = canvas.width / 2;
            const isMobile = canvas.width < 600;
            const sizeHeart = isMobile ? 24 : 38;

            bSi = { x: xBtn, y: yBtn, r: sizeHeart * 1.5 };
            
            // Dibuja el gran corazón rojo brillante de fondo
            drawHeartShape(bSi.x, bSi.y, sizeHeart, '#ff0000');
        }

        function drawHeartShape(x, y, size, color) {
            ctx.save();
            ctx.fillStyle = color;
            ctx.shadowBlur = 18; 
            ctx.shadowColor = color;
            ctx.beginPath();
            ctx.moveTo(x, y);
            
            // Curvas perfectas del corazón técnico
            ctx.bezierCurveTo(x + size, y - size, x + size * 2, y + size, x, y + size * 2.2);
            ctx.bezierCurveTo(x - size * 2, y + size, x - size, y - size, x, y);
            
            ctx.fill();
            ctx.restore();
        }

        function animate() {
            // Fondo oscuro limpio
            ctx.fillStyle = 'black';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Movimiento de las estrellas del espacio exterior
            stars.forEach(s => {
                ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
                ctx.beginPath(); 
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2); 
                ctx.fill();
                s.y += s.speed; 
                if (s.y > canvas.height) s.y = 0;
            });

            // Dibujar el gran corazón rojo animado en bucle
            drawButtons();

            requestAnimationFrame(animate);
        }

        // Detección táctil optimizada para móviles (Galaxy A56)
        function handleAction(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            
            if (!clientX || !clientY) return;

            const mx = clientX - rect.left;
            const my = clientY - rect.top;

            // Área de colisión ampliada a 110 para evitar toques en falso
            if (bSi && Math.sqrt((mx - bSi.x)**2 + (my - bSi.y)**2) < 110) {
                // Pequeño extra por si pulsa la pantalla, salte amor
                alert("¡Te amo muchísimo más cada día! ❤️");
            }
        }

        canvas.addEventListener('mousedown', handleAction);
        canvas.addEventListener('touchstart', handleAction);

        resize();
        animate();
    </script>
</body>
</html>
